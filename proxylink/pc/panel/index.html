<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxylink</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<header>
  <img src="/logo.svg" alt="" width="44" height="44">
  <div class="grow">
    <h1>proxylink</h1>
    <div id="pc" class="muted">connecting...</div>
  </div>
  <div id="pill" class="pill off">offline</div>
</header>

<main>
  <section id="offline" class="card hidden">
    <h2>panel is not authorized</h2>
    <p class="muted">open it from the proxylink tray icon: bottom right, arrow up, "open panel".</p>
  </section>

  <section id="phones"></section>

  <section id="sendcard" class="card hidden">
    <h2>send to phone</h2>
    <div class="row">
      <select id="target"></select>
    </div>
    <textarea id="text" rows="3" placeholder="text or link"></textarea>
    <div class="row">
      <button id="sendtext" class="primary">send text</button>
      <button id="pick">choose files</button>
      <input id="files" type="file" multiple class="hidden">
    </div>
    <div id="drop" class="drop">drop files here</div>
    <div id="progress" class="muted"></div>
  </section>

  <section class="card">
    <h2>settings</h2>
    <label class="check"><input id="openlinks" type="checkbox"> open links from phone in the browser</label>
    <label class="check"><input id="openfiles" type="checkbox"> open received files</label>
  </section>

  <section class="card">
    <h2>log</h2>
    <ul id="log" class="log"></ul>
  </section>
</main>
<script src="/panel.js"></script>
</body>
</html>
