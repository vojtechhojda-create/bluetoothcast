name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./pc/package.json').version")-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: decode keystore
        if: env.KEYSTORE_B64 != ''
        shell: bash
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: build signed release apk
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=${{ steps.ver.outputs.version }} -PappCode=${{ steps.ver.outputs.code }}
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/proxylink-${{ steps.ver.outputs.version }}.apk

      - name: build debug apk (no keystore secret set)
        if: env.KEYSTORE_B64 == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PappVersion=${{ steps.ver.outputs.version }} -PappCode=${{ steps.ver.outputs.code }}
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/proxylink-${{ steps.ver.outputs.version }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  pc:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: pc
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p "require('./package.json').version")-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - run: npm run build:loopback
      - run: test -f bin/loopback.exe

      - name: extension version from tag
        run: |
          v="${{ steps.ver.outputs.version }}"
          if [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            node -e "const fs=require('fs');const f='extension-zen/manifest.json';const m=JSON.parse(fs.readFileSync(f,'utf8'));m.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$v"
          fi

      - name: extension zip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          npx web-ext build --source-dir extension-zen --artifacts-dir "$GITHUB_WORKSPACE/out" --filename "proxylink-zen-extension-{version}.zip" --overwrite-dest

      - name: extension signed xpi (only with amo secrets)
        if: env.AMO_API_KEY != ''
        continue-on-error: true
        run: |
          npx web-ext sign --source-dir extension-zen --channel unlisted --artifacts-dir "$GITHUB_WORKSPACE/out" --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET"

      - name: package pc app
        run: |
          npm prune --omit=dev
          st="$RUNNER_TEMP/stage/proxylink-pc"
          mkdir -p "$st"
          cp -r dist bin panel scripts twocode extension-zen node_modules package.json README.md start.bat start-console.bat "$st/"
          cd "$RUNNER_TEMP/stage"
          7z a -tzip "$GITHUB_WORKSPACE/out/proxylink-pc-${{ steps.ver.outputs.version }}-windows.zip" proxylink-pc > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
