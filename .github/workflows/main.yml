name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Locate project and build APK
        run: |
          # Najde složku, kde leží settings.gradle nebo build.gradle
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1))
          echo "Projekt nalezen v: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcaudio-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
