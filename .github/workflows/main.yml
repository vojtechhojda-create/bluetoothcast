name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Gradle Wrapper dynamically on CI
        working-directory: BluetoothCast
        run: |
          # Stáhne čistou distribuci Gradle 8.9 přímo na server a vygeneruje wrapper
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -q gradle.zip
          gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: BluetoothCast
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pcaudio-apk
          path: BluetoothCast/app/build/outputs/apk/debug/app-debug.apk
